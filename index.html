<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Labyrinth OMEGA - Latest Build</title>
<style>
body{
    margin:0;
    background:#050507;
    overflow:hidden;
    font-family: monospace;
    color:white;
    touch-action: none; /* Prevent scrolling on touch */
}

#start-screen {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle, #0a0a1a 0%, #020205 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
}

.glow-text {
    font-size: 48px;
    font-weight: bold;
    color: #8b5cf6;
    text-shadow: 0 0 20px #8b5cf6;
    margin-bottom: 10px;
}

#start-btn {
    padding: 15px 40px;
    font-size: 24px;
    font-family: 'monospace';
    background: #8b5cf6;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 30px;
    box-shadow: 0 0 15px #8b5cf6;
    transition: 0.3s;
}

#start-btn:hover {
    background: #a78bfa;
    transform: scale(1.1);
}

#hud{
    position:absolute;
    top:15px;
    left:15px;
    font-size:16px;
    text-shadow: 1px 1px 2px black;
    pointer-events: none;
    z-index: 10;
}

#upgrade{
    position:absolute;
    inset:0;
    background:rgba(5, 5, 7, 0.9);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:20px;
    z-index: 20;
}

.card{
    border:2px solid #8b5cf6;
    background: rgba(139, 92, 246, 0.1);
    padding:20px;
    width:260px;
    max-width: 80%;
    text-align:center;
    cursor:pointer;
    transition: 0.2s;
    font-weight: bold;
    letter-spacing: 1px;
}

.card:hover {
    background: rgba(139, 92, 246, 0.4);
    transform: scale(1.05);
}

#xp-bar-container {
    width: 200px;
    max-width: 100%;
    height: 10px;
    background: #222;
    margin-top: 5px;
    border: 1px solid #555;
}

#xp-bar {
    width: 0%;
    height: 100%;
    background: #fbbf24;
    transition: width 0.2s;
}

/* Touch controls removed in favor of virtual joysticks drawn on canvas */
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="start-screen">
    <div class="glow-text">ECHO LABYRINTH<br>OMEGA</div>
    <div style="color: #a78bfa; letter-spacing: 2px;">RETRO CHIPTUNE EDITION</div>
    <button id="start-btn">INITIALIZE SYSTEM</button>
    <p style="margin-top: 20px; color: #555; font-size: 12px;">WASD: MOVE // MOUSE: AIM // LEFT CLICK: FIRE // RIGHT CLICK: DASH</p>
</div>

<div id="hud">
    <div style="font-size: 20px; font-weight: bold; color: #8b5cf6;">ECHO LABYRINTH OMEGA</div>
    Score: <span id="score">0</span><br>
    Level: <span id="level">1</span><br>
    Shield: <span id="shield">3</span> / <span id="maxShield">3</span><br>
    <div style="color: #fbbf24; font-weight: bold;">Combo: <span id="combo">0</span>x</div>
    <div id="xp-bar-container"><div id="xp-bar"></div></div>
</div>

<div id="upgrade"></div>


<script>
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");

let W, H;
function resize(){
    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

// Game State
let score=0;
let level=1;
let xp=0;
let xpMax=100;
let time=0;
let threat=0;
let combo = 0;
let comboTimer = 0;
let hyperMode = 0;

// Polish / Juice
let shakeTime=0;
let shakeMag=0;
let hitStop = 0;
let stars=[];

// Entity Arrays
let particles=[];
let enemies=[];
let shards=[];
let upgrades=[]; // In-world floating upgrades
let projectiles=[];
let drones=[];
let mines=[];
let trails=[]; // For visual trails

// Player Object
const player={
    x:W/2,
    y:H/2,
    r:18,
    vx:0,
    vy:0,
    speed:6,
    shield:3,
    maxShield:3,
    shieldRegenTimer:0,
    dash:0,
    weapon:"pulse",
    fire:0,
    angle: 0,    // Movement rotation
    aimAngle: 0, // 360 Gun direction
    targetX: W/2,
    targetY: H/2
};

// === WEB AUDIO SFX ENGINE ===
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playSound(freq, type, duration, vol=0.1) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

const sfx = {
    shoot: () => playSound(400 + Math.random()*200, 'square', 0.1),
    explode: () => playSound(100, 'sawtooth', 0.3, 0.2),
    dash: () => playSound(800, 'sine', 0.2),
    pickup: () => playSound(1200, 'square', 0.05),
    hit: () => playSound(50, 'square', 0.2, 0.2)
};

// === COSMIC SUSPENSE MUSIC ENGINE (Procedural) ===
const MusicEngine = {
    active: false,
    nodes: [],
    intensity: 0,
    targetIntensity: 0,
    idleTimer: 0,

    init() {
        if (this.active) return;
        this.active = true;

        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.4;
        masterGain.connect(audioCtx.destination);
        this.masterGain = masterGain;

        // 1. Cosmic Drone (Low Void)
        const drone = audioCtx.createOscillator();
        const droneGain = audioCtx.createGain();
        const lpf = audioCtx.createBiquadFilter();

        drone.type = 'sawtooth';
        drone.frequency.value = 55; // A1
        lpf.type = 'lowpass';
        lpf.frequency.value = 200;

        drone.connect(lpf);
        lpf.connect(droneGain);
        droneGain.connect(masterGain);

        drone.start();
        this.nodes.push(drone, droneGain, lpf);
        this.droneGain = droneGain;
        this.lpf = lpf;

        // 2. Suspense Pulse (The Heartbeat)
        this.pulseTimer = 0;
    },

    update() {
        if (!this.active) return;

        // Progression check: if combo or hypermode or moving, intensity goes up
        const isMoving = Math.abs(player.vx) > 0.5 || Math.abs(player.vy) > 0.5;
        if (combo > 0 || hyperMode > 0 || isMoving) {
            this.idleTimer = 0;
            this.targetIntensity = Math.max(this.targetIntensity, 0.8 + (combo * 0.05));
        } else {
            this.idleTimer++;
            if (this.idleTimer > 120) { // 2 seconds idle
                this.targetIntensity *= 0.98; // Fade out target
                if(this.targetIntensity < 0.1) this.targetIntensity = 0.1;
            }
        }

        // Smoothly transition intensity
        this.intensity += (this.targetIntensity - this.intensity) * 0.05;

        // Modulate Drone
        this.droneGain.gain.value = 0.1 + (this.intensity * 0.2);
        this.lpf.frequency.value = 100 + (this.intensity * 800);

        // Pulsing Beat
        this.pulseTimer++;
        const bpm = 80 + (this.intensity * 40);
        const framesPerBeat = Math.floor(3600 / bpm);

        if (this.pulseTimer % framesPerBeat === 0 && this.intensity > 0.2) {
            this.playPulse();
        }
    },

    playPulse() {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(40 + (this.intensity * 20), audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        g.gain.setValueAtTime(this.intensity * 0.3, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.connect(g);
        g.connect(this.masterGain);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
    }
};

function playMusic() {
    MusicEngine.init();
}

function nextMusic() {
    triggerShake(8, 3);
    MusicEngine.targetIntensity += 0.5; // Surge of energy
}

// Initialize Parallax Starfield
for(let i=0; i<150; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() * 2 + 0.5,
        alpha: Math.random()
    });
}

function dist(a,b,c,d){ return Math.hypot(a-c,b-d); }
function rand(a,b){ return a+Math.random()*(b-a); }

function spawnShard(){
    shards.push({ x:rand(40,W-40), y:rand(40,H-40) });
}
for(let i=0;i<12;i++) spawnShard();

function spawnEnemy(){
    let r=Math.random();
    if(r<.4){
        enemies.push({ type:"sentinel", x:rand(0,W), y:rand(0,H), tx:rand(0,W), ty:rand(0,H), fire:100 });
    } else if(r<.7){
        enemies.push({ type:"hunter", x:rand(0,W), y:rand(0,H), vx:0, vy:0 });
    } else {
        enemies.push({ type:"miner", x:rand(0,W), y:rand(0,H), drop:200 });
    }
}

function spawnBoss(){
    enemies.push({ type:"boss", x:W/2, y:80, hp:400, cool:0 });
    nextMusic(); // boss = new banger
}

function explosion(x,y,color,n=30){
    sfx.explode();
    for(let i=0;i<n;i++){
        particles.push({
            x, y,
            vx:rand(-5,5),
            vy:rand(-5,5),
            life:1,
            c:color
        });
    }
}

function triggerShake(duration, magnitude) {
    shakeTime = duration;
    shakeMag = magnitude;
}

let magnet=0;
let isPaused=false;

function spawnUpgrades(){
    const pool=[
        {name:"OVERCLOCK", f:()=>player.speed+=1.5, c: "#fbbf24"},
        {name:"DRONE", f:()=>drones.push({a:rand(0,6),r:60,cd:0}), c: "#22c55e"},
        {name:"MAGNET", f:()=>magnet=1, c: "#a855f7"},
        {name:"SHIELD+", f:()=>{player.maxShield++; player.shield=player.maxShield;}, c: "#0ea5e9"},
        {name:"SPREAD", f:()=>player.weapon="spread", c: "#f43f5e"},
        {name:"RAILGUN", f:()=>player.weapon="rail", c: "#ffffff"},
        {name:"RICOCHET", f:()=>player.weapon="ricochet", c: "#f97316"},
        {name:"PIERCE", f:()=>player.weapon="pierce", c: "#8b5cf6"}
    ];

    let shuffled = pool.sort(() => 0.5 - Math.random());
    let selected = shuffled.slice(0, 3);

    for(let i=0; i<3; i++){
        upgrades.push({
            x: player.x + Math.cos(i * 2 + Math.PI/2) * 150,
            y: player.y + Math.sin(i * 2 + Math.PI/2) * 150,
            r: 25,
            ...selected[i]
        });
    }
}

function fireWeapon(){
    if(player.fire>0)return;
    player.fire = hyperMode > 0 ? 6 : 12;
    sfx.shoot();

    const vx = Math.cos(player.aimAngle) * 12;
    const vy = Math.sin(player.aimAngle) * 12;

    if(player.weapon==="pulse"){
        projectiles.push({ x:player.x, y:player.y, vx, vy, friendly:1 });
    }
    if(player.weapon==="spread"){
        for(let i=-1;i<=1;i++){
            const a = player.aimAngle + i * 0.2;
            projectiles.push({ x:player.x, y:player.y, vx:Math.cos(a)*12, vy:Math.sin(a)*12, friendly:1 });
        }
    }
    if(player.weapon==="rail"){
        for(let i=0;i<8;i++){
            projectiles.push({ x:player.x+vx*i, y:player.y+vy*i, vx:vx*1.5, vy:vy*1.5, friendly:1 });
        }
    }
    if(player.weapon==="ricochet"){
        projectiles.push({ x:player.x, y:player.y, vx, vy, friendly:1, bounce:3 });
    }
    if(player.weapon==="pierce"){
        projectiles.push({ x:player.x, y:player.y, vx, vy, friendly:1, pierce:1 });
    }
}

function gainXp(amount) {
    combo++;
    comboTimer = 120; // 2 seconds at 60fps
    xp += amount;
    score += amount * 10 * combo;
    MusicEngine.targetIntensity += 0.1; // Progress audio on score
    if(xp >= xpMax) {
        xp -= xpMax;
        xpMax = Math.floor(xpMax * 1.5);
        level++;
        triggerShake(10, 5);
        explosion(player.x, player.y, "#8b5cf6", 50);
        nextMusic();
        spawnUpgrades();
    }
}

function damage(){
    player.shield--;
    player.shieldRegenTimer = 300;
    triggerShake(15, 8);
    hitStop = 8;
    sfx.hit();
    explosion(player.x,player.y,"#ff4444",50);

    if(player.shield<=0){
        let msg = document.createElement('div');
        msg.style.position = 'absolute';
        msg.style.top = '50%';
        msg.style.left = '50%';
        msg.style.transform = 'translate(-50%, -50%)';
        msg.style.background = 'rgba(255, 0, 0, 0.8)';
        msg.style.padding = '20px';
        msg.style.border = '2px solid white';
        msg.style.textAlign = 'center';
        msg.style.zIndex = '100';
        msg.innerHTML = `<h2>CRITICAL FAILURE</h2><p>Final Score: ${score}</p><p>Level Reached: ${level}</p><button onclick="location.reload()" style="padding:10px; cursor:pointer;">REBOOT</button>`;
        document.body.appendChild(msg);
        isPaused = true;
    }
}

function update(){
    if(isPaused) return;
    if(hitStop > 0) { hitStop--; return; }

    MusicEngine.update();

    if(comboTimer > 0) {
        comboTimer--;
    } else {
        combo = 0;
    }

    if(combo >= 20 && hyperMode <= 0) {
        hyperMode = 300; // 5 seconds of hyper mode
        triggerShake(10, 5);
    }
    if(hyperMode > 0) hyperMode--;

    time++;
    threat=(time/1500)+(score/5000);

    if(Math.random()<threat*.025) spawnEnemy();
    if(time%3000===0) spawnBoss();

    if(Object.values(keys).every(v => !v) && (player.targetX !== player.x || player.targetY !== player.y)) {
        let dx = player.targetX - player.x;
        let dy = player.targetY - player.y;
        let d = Math.hypot(dx, dy);
        if(d > 5) {
            player.vx += (dx / d) * player.speed * 0.1;
            player.vy += (dy / d) * player.speed * 0.1;
        }
    }

    player.x+=player.vx;
    player.y+=player.vy;
    player.vx*=.85;
    player.vy*=.85;
    player.x=Math.max(20,Math.min(W-20,player.x));
    player.y=Math.max(20,Math.min(H-20,player.y));

    if(player.dash > 0) player.dash--;
    if(player.fire>0) player.fire--;

    if(player.shield < player.maxShield && player.shield > 0) {
        if(player.shieldRegenTimer > 0) {
            player.shieldRegenTimer--;
        } else {
            player.shield++;
            player.shieldRegenTimer = 200;
            explosion(player.x, player.y, "#0ea5e9", 15);
        }
    }

    if(Math.abs(player.vx)>1 || Math.abs(player.vy)>1) {
        trails.push({x: player.x, y: player.y, life: 1, c: "#8b5cf6"});
    }

    for(let s of shards){
        if(magnet){
            let d=dist(player.x,player.y,s.x,s.y);
            if(d<250){
                s.x+=(player.x-s.x)*.08;
                s.y+=(player.y-s.y)*.08;
            }
        }
        if(dist(player.x,player.y,s.x,s.y)<40){
            gainXp(20);
            sfx.pickup();
            explosion(s.x,s.y,"#fbbf24", 10);
            s.x=rand(40,W-40);
            s.y=rand(40,H-40);
        }
    }

    for (let i = upgrades.length - 1; i >= 0; i--) {
        let u = upgrades[i];
        if (dist(player.x, player.y, u.x, u.y) < 50) {
            u.f();
            sfx.pickup();
            explosion(u.x, u.y, u.c, 30);
            upgrades = []; // Remove all 3 choices
            break;
        }
    }

    for(let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        
        if(e.type==="sentinel"){
            let d=dist(e.x,e.y,e.tx,e.ty);
            if(d<10){ e.tx=rand(0,W); e.ty=rand(0,H); }
            e.x+=(e.tx-e.x)*.015;
            e.y+=(e.ty-e.y)*.015;
            e.fire--;
            if(e.fire<0){
                let a=Math.atan2(player.y-e.y,player.x-e.x);
                projectiles.push({ x:e.x, y:e.y, vx:Math.cos(a)*6, vy:Math.sin(a)*6 });
                e.fire=100;
            }
        }
        
        if(e.type==="hunter"){
            e.vx+=(player.x-e.x)*.003;
            e.vy+=(player.y-e.y)*.003;
            e.vx *= 0.95; e.vy *= 0.95;
            e.x+=e.vx; e.y+=e.vy;
            trails.push({x: e.x, y: e.y, life: 0.5, c: "#ef4444"});
        }
        
        if(e.type==="miner"){
            e.drop--;
            if(e.drop<0){
                mines.push({ x:e.x, y:e.y, timer:150 });
                e.drop=150;
            }
        }
        
        if(e.type==="boss"){
            e.cool--;
            if(e.hp < 200) {
                // Phase 2: Spinning Lasers
                e.rot = (e.rot || 0) + 0.05;
                if(e.cool < 0) {
                    for(let j=0; j<4; j++) {
                        let a = e.rot + (j * Math.PI / 2);
                        projectiles.push({ x:e.x, y:e.y, vx:Math.cos(a)*7, vy:Math.sin(a)*7 });
                    }
                    e.cool = 10;
                }
            } else {
                // Phase 1: Radial Burst
                if(e.cool<0){
                    for(let j=0;j<24;j++){
                        let a=j/24*Math.PI*2;
                        projectiles.push({ x:e.x, y:e.y, vx:Math.cos(a)*5, vy:Math.sin(a)*5 });
                    }
                    e.cool=80;
                    triggerShake(5, 3);
                }
            }
            if(e.hp <= 0) {
                explosion(e.x, e.y, "#ff0077", 100);
                triggerShake(20, 10);
                score += 5000;
                enemies.splice(i, 1);
                continue;
            }
        }

        if(dist(player.x,player.y,e.x,e.y)<player.r+12) {
            damage();
            if(e.type !== "boss") {
                explosion(e.x, e.y, "#ef4444", 20);
                enemies.splice(i, 1);
            }
        }
    }

    for(let p of projectiles){
        p.x+=p.vx;
        p.y+=p.vy;

        if(p.bounce > 0) {
            if(p.x < 0 || p.x > W) { p.vx *= -1; p.bounce--; }
            if(p.y < 0 || p.y > H) { p.vy *= -1; p.bounce--; }
        }

        trails.push({x: p.x, y: p.y, life: 0.8, c: p.friendly ? (hyperMode > 0 ? "#fbbf24" : "#fff") : "#ff0077"});

        if(!p.friendly && dist(player.x,player.y,p.x,p.y)<player.r+4){
            damage();
            p.dead=1;
        }

        if(p.friendly) {
            for(let e of enemies) {
                if(dist(p.x, p.y, e.x, e.y) < (e.type === "boss" ? 35 : 20)) {
                    if(!p.pierce) p.dead = 1;
                    if(e.type === "boss") {
                        e.hp -= 10;
                    } else {
                        explosion(e.x, e.y, "#ef4444", 20);
                        e.dead = 1;
                        gainXp(10);
                    }
                }
            }
        }
    }
    projectiles=projectiles.filter(p=>!p.dead);
    enemies=enemies.filter(e=>!e.dead);

    for(let d of drones){
        d.a+=.04;
        d.x=player.x+Math.cos(d.a)*d.r;
        d.y=player.y+Math.sin(d.a)*d.r;
        trails.push({x: d.x, y: d.y, life: 0.5, c: "#22c55e"});
        d.cd--;
        if(d.cd<0){
            projectiles.push({ x:d.x, y:d.y, vx:rand(-2,2), vy:-12, friendly:1 });
            d.cd=20;
        }
    }

    for(let m of mines){
        m.timer--;
        if(m.timer<0){
            explosion(m.x,m.y,"#ff8800",60);
            triggerShake(5, 4);
            if(dist(player.x,player.y,m.x,m.y)<85) damage();
            m.dead=1;
        }
    }
    mines=mines.filter(m=>!m.dead);

    for(let p of particles){ p.x+=p.vx; p.y+=p.vy; p.life-=.03; }
    particles=particles.filter(p=>p.life>0);

    for(let t of trails){ t.life -= 0.1; }
    trails = trails.filter(t=>t.life>0);

    for(let s of stars) {
        s.y += s.s * (1 + (player.vy * 0.05));
        s.x -= player.vx * 0.05;
        if(s.y > H) s.y = 0;
        if(s.x > W) s.x = 0;
        if(s.x < 0) s.x = W;
    }

    document.getElementById("score").innerText=score;
    document.getElementById("level").innerText=level;
    document.getElementById("shield").innerText=Math.max(0, player.shield);
    document.getElementById("maxShield").innerText=player.maxShield;
    document.getElementById("combo").innerText=combo;
    document.getElementById("xp-bar").style.width = (xp / xpMax * 100) + "%";
}

function draw(){
    ctx.save();
    if(shakeTime > 0) {
        let dx = rand(-shakeMag, shakeMag);
        let dy = rand(-shakeMag, shakeMag);
        ctx.translate(dx, dy);
        shakeTime--;
    }

    // Dynamic Cosmic Background (Darkens/Glows with Intensity)
    const bgVal = Math.floor(MusicEngine.intensity * 10);
    ctx.fillStyle=`rgb(${bgVal}, ${bgVal}, ${bgVal+5})`;
    ctx.fillRect(0,0,W,H);

    
    for(let s of stars) {
        ctx.globalAlpha = s.alpha;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.s, 0, 7);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Draw Joysticks (Mobile)
    if (joysticks.left.active) {
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.beginPath(); ctx.arc(joysticks.left.x, joysticks.left.y, 50, 0, 7); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.beginPath(); ctx.arc(joysticks.left.curX, joysticks.left.curY, 20, 0, 7); ctx.fill();
    }
    if (joysticks.right.active) {
        ctx.strokeStyle = "rgba(255,255,255,0.2)";
        ctx.beginPath(); ctx.arc(joysticks.right.x, joysticks.right.y, 50, 0, 7); ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.beginPath(); ctx.arc(joysticks.right.curX, joysticks.right.curY, 20, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for(let t of trails) {
        ctx.globalAlpha = t.life;
        ctx.fillStyle = t.c;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 4, 0, 7);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    for(let s of shards){
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(time * 0.05);
        ctx.fillStyle="#fbbf24";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#fbbf24";
        ctx.beginPath();
        for(let i=0; i<4; i++) {
            const a = i * Math.PI/2;
            ctx.lineTo(Math.cos(a)*8, Math.sin(a)*8);
        }
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }

    for(let u of upgrades){
        ctx.save();
        ctx.translate(u.x, u.y);
        ctx.rotate(time * 0.02);
        ctx.strokeStyle = u.c;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 15;
        ctx.shadowColor = u.c;
        ctx.strokeRect(-20, -20, 40, 40);
        ctx.fillStyle = "#fff";
        ctx.font = "bold 10px monospace";
        ctx.textAlign = "center";
        ctx.fillText(u.name, 0, 5);
        ctx.restore();
    }

    for(let e of enemies){
        ctx.save();
        ctx.translate(e.x, e.y);
        if (e.type === "hunter") ctx.rotate(Math.atan2(player.y-e.y, player.x-e.x));

        ctx.shadowBlur = 15;
        ctx.shadowColor = e.type==="boss"?"#ff0077":"#ef4444";
        ctx.fillStyle = e.type==="boss"?"#ff0077":"#ef4444";

        if(e.type === "sentinel") {
            ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(15, 15); ctx.lineTo(-15, 15); ctx.closePath(); ctx.fill();
        } else if(e.type === "hunter") {
            ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-10, -12); ctx.lineTo(-10, 12); ctx.closePath(); ctx.fill();
        } else if(e.type === "miner") {
            ctx.strokeRect(-12, -12, 24, 24); ctx.fillRect(-6, -6, 12, 12);
        } else {
            ctx.beginPath(); ctx.arc(0,0,30,0,7); ctx.fill();
        }
        ctx.restore();
        
        if(e.type==="boss") {
            // Radial ring
            ctx.strokeStyle="#fff";
            ctx.lineWidth=2;
            ctx.beginPath();
            ctx.arc(e.x, e.y, 35, 0, (e.hp/400) * Math.PI * 2);
            ctx.stroke();

            // Screen Top Health Bar
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.fillRect(W/2 - 200, 20, 400, 10);
            ctx.fillStyle = "#ff0077";
            ctx.fillRect(W/2 - 200, 20, (e.hp/400) * 400, 10);
            ctx.strokeStyle = "#fff";
            ctx.strokeRect(W/2 - 200, 20, 400, 10);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 12px monospace";
            ctx.textAlign = "center";
            ctx.fillText("BOSS: OVERLORD ECHO", W/2, 15);
            ctx.textAlign = "left"; // reset
        }
    }

    for(let p of projectiles){
        ctx.shadowBlur = hyperMode > 0 && p.friendly ? 25 : 15;
        ctx.shadowColor = p.friendly ? (hyperMode > 0 ? "#fbbf24" : "#fff") : "#ff0077";
        ctx.fillStyle= p.friendly ? (hyperMode > 0 ? "#fbbf24" : "#fff") : "#ff0077";
        ctx.beginPath();
        ctx.arc(p.x,p.y,4,0,7);
        ctx.fill();
        ctx.shadowBlur = 0;
    }

    // Draw Player (Vector Ship)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#8b5cf6";
    ctx.strokeStyle = "#8b5cf6";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.lineTo(-15, -15);
    ctx.lineTo(-8, 0);
    ctx.lineTo(-15, 15);
    ctx.closePath();
    ctx.stroke();

    // Shield
    if(player.shield > 0) {
        ctx.strokeStyle = `rgba(14, 165, 233, ${player.shield / player.maxShield})`;
        ctx.beginPath(); ctx.arc(0, 0, 25, 0, 7); ctx.stroke();
    }
    ctx.restore();

    // Gun Turret (360)
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.aimAngle);
    ctx.fillStyle = "#fff";
    ctx.fillRect(5, -3, 15, 6);
    ctx.restore();

    for(let d of drones){
        ctx.fillStyle="#22c55e";
        ctx.beginPath();
        ctx.arc(d.x,d.y,6,0,7);
        ctx.fill();
    }

    for(let m of mines){
        ctx.fillStyle="#ff8800";
        ctx.beginPath();
        ctx.arc(m.x,m.y,8,0,7);
        ctx.fill();
    }

    for(let p of particles){
        ctx.globalAlpha=p.life;
        ctx.fillStyle=p.c;
        ctx.fillRect(p.x,p.y,4,4);
    }
    ctx.globalAlpha=1;

    // --- CRT Scanlines & Vignette (Drawn on top) ---
    // Scanlines
    ctx.fillStyle = "rgba(18, 16, 16, 0.15)";
    for(let i=0; i<H; i+=4) {
        ctx.fillRect(0, i, W, 1);
    }
    // Vignette (Stronger for suspense)
    let grd = ctx.createRadialGradient(W/2, H/2, W*0.1, W/2, H/2, W*0.8);
    grd.addColorStop(0, "transparent");
    grd.addColorStop(1, "rgba(0,0,0,0.85)");
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,W,H);

    ctx.restore();
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

// Start everything
window.onload = function() {
    loop();
};

document.getElementById('start-btn').onclick = function() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    document.getElementById('start-screen').style.display = 'none';
    playMusic();
    sfx.pickup();
};

// Controls
let keys={};
let mouse = { x: 0, y: 0, down: false };
addEventListener("keydown",e=>keys[e.key]=1);
addEventListener("keyup",e=>keys[e.key]=0);
addEventListener("mousedown", () => mouse.down = true);
addEventListener("mouseup", () => mouse.down = false);
addEventListener("mousemove", (e) => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

// Joysticks for mobile
const joysticks = {
    left: { active: false, x: 0, y: 0, curX: 0, curY: 0 },
    right: { active: false, x: 0, y: 0, curX: 0, curY: 0 }
};

setInterval(()=>{
    let mvX = 0, mvY = 0;
    if(keys.w || keys.ArrowUp) mvY -= 1;
    if(keys.s || keys.ArrowDown) mvY += 1;
    if(keys.a || keys.ArrowLeft) mvX -= 1;
    if(keys.d || keys.ArrowRight) mvX += 1;

    // Mobile Left Stick
    if (joysticks.left.active) {
        mvX = (joysticks.left.curX - joysticks.left.x) / 50;
        mvY = (joysticks.left.curY - joysticks.left.y) / 50;
    }

    player.vx += mvX * player.speed * 0.15;
    player.vy += mvY * player.speed * 0.15;
    
    if(player.vx > player.speed) player.vx = player.speed;
    if(player.vx < -player.speed) player.vx = -player.speed;
    if(player.vy > player.speed) player.vy = player.speed;
    if(player.vy < -player.speed) player.vy = -player.speed;

    // 360 Aiming
    if (joysticks.right.active) {
        player.aimAngle = Math.atan2(joysticks.right.curY - joysticks.right.y, joysticks.right.curX - joysticks.right.x);
        fireWeapon();
    } else {
        player.aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
        if (mouse.down || keys[" "]) fireWeapon();
    }

    if (mvX !== 0 || mvY !== 0) {
        player.angle = Math.atan2(mvY, mvX);
    }

},16);

function doDash() {
    if(player.dash<=0){
        let dashX = Math.cos(player.angle) * 150;
        let dashY = Math.sin(player.angle) * 150;
        player.x += dashX;
        player.y += dashY;
        player.dash = 45;
        triggerShake(5, 5);
        sfx.dash();
        explosion(player.x,player.y,"#8b5cf6", 20);
    }
}

canvas.oncontextmenu = e => {
    e.preventDefault();
    doDash();
};

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        if (t.clientX < W / 2) {
            joysticks.left.active = true;
            joysticks.left.x = joysticks.left.curX = t.clientX;
            joysticks.left.y = joysticks.left.curY = t.clientY;
            joysticks.left.id = t.identifier;
        } else {
            joysticks.right.active = true;
            joysticks.right.x = joysticks.right.curX = t.clientX;
            joysticks.right.y = joysticks.right.curY = t.clientY;
            joysticks.right.id = t.identifier;
        }
    }
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        if (joysticks.left.active && t.identifier === joysticks.left.id) {
            joysticks.left.curX = t.clientX;
            joysticks.left.curY = t.clientY;
        }
        if (joysticks.right.active && t.identifier === joysticks.right.id) {
            joysticks.right.curX = t.clientX;
            joysticks.right.curY = t.clientY;
        }
    }
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        if (joysticks.left.id === t.identifier) joysticks.left.active = false;
        if (joysticks.right.id === t.identifier) joysticks.right.active = false;

        // Double tap or flick can be dash, but for now let's keep it simple
        // If it was a quick tap on left side, do a dash
        if (t.clientX < W/2 && dist(t.clientX, t.clientY, joysticks.left.x, joysticks.left.y) < 10) {
             doDash();
        }
    }
}, {passive: false});
</script>
